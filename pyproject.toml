[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

select = [
  "E",  # 문법/스타일 에러
  "F",  # 치명적 버그
  "I",  # import 정렬
]

ignore = [
  "E501",  # line length (Black이 처리)
]

fix = true

[tool.mypy]
python_version = 3.11

ignore_missing_imports = true

check_untyped_defs = true
disallow_untyped_defs = false

warn_unused_ignores = true
warn_redundant_casts = true
